<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{{ title }}</title><link rel="stylesheet" href="/static/styles.css"/></head>
<body><main>
<h1>{{ title }}</h1><p class="sub">Define intents &amp; routes, then classify utterances.</p>
<div class="grid">
<section class="card">
  <h2>Intent</h2>
  <form method="post" action="/ui/intents"><label>Name</label><input name="name" required/>
  <label>Description</label><textarea name="description" rows="2"></textarea><button type="submit">Save</button></form>
  <h2>Rule</h2>
  <form method="post" action="/ui/rules"><label>Intent</label><input name="intent_name" required/>
  <label>Destination</label><input name="destination" value="queue.billing"/>
  <label>Min confidence</label><input name="min_confidence" type="number" step="0.01" value="0.5"/>
  <button type="submit">Add rule</button></form>
</section>
<section class="card">
  <h2>Route utterance</h2>
  <form method="post" action="/ui/route"><label>Utterance</label>
  <textarea name="utterance" rows="3" required>{{ utterance or '' }}</textarea><button type="submit">Classify</button></form>
  {% if last %}<pre>{{ last }}</pre>{% endif %}
  <h3>Recent turns</h3>
  {% for t in turns %}<div class="sub">{{ t.intent_name }} → {{ t.destination }} ({{ t.confidence }}) · {{ t.utterance }}</div>{% endfor %}
</section>
</div></main></body></html>
